<main class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <h1 class="login-card__title">Welcome</h1>

    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input
        id="email"
        class="field__input"
        type="email"
        formControlName="email"
        autocomplete="email"
        [class.field__input--invalid]="showError(email)"
      />
      @if (showError(email)) {
        <p class="field__error">
          @if (email.hasError('required')) {
            Email is required
          } @else if (email.hasError('email')) {
            Enter a valid email address
          }
        </p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="password">Password</label>
      <input
        id="password"
        class="field__input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [class.field__input--invalid]="showError(password)"
      />
      @if (showError(password)) {
        <p class="field__error">
          @if (password.hasError('required')) {
            Password is required
          }
        </p>
      }
    </div>

    <button class="login-card__submit" type="submit" [disabled]="form.invalid">
      Sign in
    </button>

    @if (signedIn()) {
      <p class="login-card__success" role="status">Signed in (mock)</p>
    }
  </form>
</main>
