<main class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <h1 class="login-card__title">ברוכים הבאים</h1>

    <div class="field">
      <label class="field__label" for="email">שם משתמש (אימייל)</label>
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        dir="ltr"
        [fluid]="true"
        [invalid]="showError(email)"
      />
      @if (showError(email)) {
        <p-message severity="error" variant="simple" size="small" styleClass="field__error">
          @if (email.hasError('required')) {
            יש להזין אימייל
          } @else if (email.hasError('email')) {
            יש להזין כתובת אימייל תקינה
          }
        </p-message>
      }
    </div>

    <div class="field">
      <label class="field__label" for="password">
        סיסמה <span class="field__hint">(לא נדרשת כרגע)</span>
      </label>
      <input
        pInputText
        id="password"
        [fluid]="true"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        dir="ltr"
      />
    </div>

    <p-button
      type="submit"
      styleClass="login-card__submit"
      [label]="loading() ? 'מתחבר...' : 'כניסה'"
      [loading]="loading()"
      [disabled]="loading()"
    />

    @if (error(); as message) {
      <p-message severity="error" styleClass="login-card__error" role="alert">{{ message }}</p-message>
    }
  </form>
</main>
