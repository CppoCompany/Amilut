<main class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <h1 class="login-card__title">ברוכים הבאים</h1>

    <div class="field">
      <label class="field__label" for="email">שם משתמש (אימייל)</label>
      <input
        id="email"
        class="field__input"
        type="email"
        formControlName="email"
        autocomplete="username"
        dir="ltr"
        [class.field__input--invalid]="showError(email)"
      />
      @if (showError(email)) {
        <p class="field__error">
          @if (email.hasError('required')) {
            יש להזין אימייל
          } @else if (email.hasError('email')) {
            יש להזין כתובת אימייל תקינה
          }
        </p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="password">
        סיסמה <span class="field__hint">(לא נדרשת כרגע)</span>
      </label>
      <input
        id="password"
        class="field__input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        dir="ltr"
      />
    </div>

    <button class="login-card__submit" type="submit" [disabled]="loading()">
      @if (loading()) {
        <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
        מתחבר...
      } @else {
        כניסה
      }
    </button>

    @if (error(); as message) {
      <p class="login-card__error" role="alert">{{ message }}</p>
    }
  </form>
</main>
