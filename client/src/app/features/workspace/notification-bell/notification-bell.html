<p-overlaybadge
  [value]="unreadCount() > 99 ? '99+' : unreadCount()"
  severity="danger"
  badgeSize="small"
  [badgeDisabled]="unreadCount() === 0"
  styleClass="bell-badge-host"
>
  <p-button
    icon="fa-solid fa-bell"
    [text]="true"
    severity="secondary"
    styleClass="bell-button"
    [ariaLabel]="unreadCount() > 0 ? 'התראות (' + unreadCount() + ' שלא נקראו)' : 'התראות'"
    [attr.aria-expanded]="open()"
    (onClick)="toggle($event)"
  />
</p-overlaybadge>

<p-popover styleClass="bell-popover" ariaLabel="התראות" (onShow)="onShow()" (onHide)="onHide()">
  <div class="bell-dropdown" role="dialog" aria-label="התראות">
    <div class="bell-dropdown-header">
      <span>התראות</span>
      @if (unreadCount() > 0) {
        <span class="bell-dropdown-count">{{ unreadCount() }} חדשות</span>
      }
    </div>
    @if (loading() && notifications().length === 0) {
      <p class="bell-empty" role="status">טוען...</p>
    } @else if (notifications().length === 0) {
      <p class="bell-empty">
        <i class="fa-solid fa-bell-slash" aria-hidden="true"></i>
        אין התראות
      </p>
    } @else {
      <ul class="bell-list">
        @for (notification of notifications(); track notification.id) {
          <li>
            <button
              type="button"
              class="bell-item"
              [class.bell-item--unread]="!notification.isRead"
              (click)="markRead(notification)"
            >
              <span class="bell-item__dot" aria-hidden="true"></span>
              <span class="bell-item__body">
                <span class="bell-item__message">{{ notification.message }}</span>
                <span class="bell-item__meta">
                  {{ relativeTime(notification.createdAt) }}
                  @if (notification.actorName) {
                    · {{ notification.actorName }}
                  }
                </span>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</p-popover>
