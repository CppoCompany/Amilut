<button
  type="button"
  class="bell-button"
  [attr.aria-label]="unreadCount() > 0 ? 'התראות (' + unreadCount() + ' שלא נקראו)' : 'התראות'"
  (click)="toggle()"
>
  <i class="fa-solid fa-bell"></i>
  @if (unreadCount() > 0) {
    <span class="bell-badge">{{ unreadCount() }}</span>
  }
</button>

@if (open()) {
  <div class="bell-dropdown">
    <div class="bell-dropdown-header">התראות</div>
    @if (loading()) {
      <p class="bell-empty">טוען...</p>
    } @else if (notifications().length === 0) {
      <p class="bell-empty">אין התראות</p>
    } @else {
      <ul class="bell-list">
        @for (notification of notifications(); track notification.id) {
          <li
            class="bell-item"
            [class.bell-item--unread]="!notification.isRead"
            (click)="markRead(notification)"
          >
            {{ notification.message }}
          </li>
        }
      </ul>
    }
  </div>
}
