<div class="breadcrumb-bar">
  <p-breadcrumb [home]="home" [model]="trail()" styleClass="breadcrumb-trail" ariaLabel="breadcrumb">
    <ng-template #separator><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></ng-template>
  </p-breadcrumb>

  @if (selectedLabel(); as label) {
    <div class="breadcrumb-selection">
      <p-button
        [label]="label"
        [icon]="selectedIcon()"
        [text]="true"
        size="small"
        styleClass="breadcrumb-selection__label"
        (onClick)="openSelected()"
      />
      <p-button
        icon="fa-solid fa-xmark"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        size="small"
        styleClass="breadcrumb-selection__clear"
        ariaLabel="נקה בחירה"
        (onClick)="clearSelection()"
      />
    </div>
  }
</div>
