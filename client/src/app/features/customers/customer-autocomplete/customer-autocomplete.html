<p-autocomplete
  [inputId]="inputId()"
  [ngModel]="value()"
  (ngModelChange)="onValueChange($event)"
  [suggestions]="results()"
  optionLabel="name"
  dataKey="id"
  [minQueryLength]="minQueryLength"
  [delay]="debounceMs"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [invalid]="invalid()"
  [showEmptyMessage]="true"
  [fluid]="true"
  appendTo="body"
  scrollHeight="240px"
  styleClass="customer-search"
  [class.customer-search--selected]="customer() !== null"
  (completeMethod)="search($event.query)"
>
  <ng-template #item let-match>
    <div class="autocomplete-option">
      <div class="autocomplete-option__name">{{ match.name }}</div>
      @if (match.phone || match.email) {
        <div class="autocomplete-option__meta">
          @if (match.phone) {
            <span dir="ltr">{{ match.phone }}</span>
          }
          @if (match.phone && match.email) {
            <span aria-hidden="true">·</span>
          }
          @if (match.email) {
            <span dir="ltr">{{ match.email }}</span>
          }
        </div>
      }
    </div>
  </ng-template>

  <ng-template #empty>
    @if (error()) {
      <div class="autocomplete-option autocomplete-option--error" role="alert">
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        <span>חיפוש הלקוחות נכשל, נסה שוב</span>
      </div>
    } @else if (showAddRow()) {
      <p-button
        [label]="'לא נמצא לקוח בשם „' + lastQuery() + '” — הוסף לקוח חדש'"
        icon="fa-solid fa-plus"
        [text]="true"
        size="small"
        styleClass="autocomplete-add"
        (onClick)="openDialog()"
      />
    }
  </ng-template>
</p-autocomplete>

@if (customer()) {
  <span class="customer-search__check" aria-hidden="true">
    <i class="fa-solid fa-circle-check"></i>
  </span>
}

@if (dialogOpen()) {
  <app-add-customer-dialog
    [initialName]="text()"
    (saved)="onDialogSaved($event)"
    (cancelled)="onDialogCancelled()"
  />
}
