<p-multiselect
  [options]="$any(options())"
  optionLabel="label"
  optionValue="value"
  [ngModel]="selected()"
  (ngModelChange)="onChange($event)"
  [placeholder]="placeholder()"
  [ariaLabel]="ariaLabel() ?? undefined"
  [showToggleAll]="false"
  [filter]="false"
  [maxSelectedLabels]="1"
  selectedItemsLabel="{0} נבחרו"
  appendTo="body"
  size="small"
  [fluid]="true"
/>
