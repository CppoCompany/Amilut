<div class="skeleton-table" aria-hidden="true">
  @for (row of rowIndexes(); track row) {
    <div class="skeleton-table__row">
      @for (column of columnIndexes(); track column) {
        <span class="skeleton-table__cell">
          <p-skeleton [width]="widthFor(column, row) + '%'" height="0.75rem" />
        </span>
      }
    </div>
  }
</div>
<p class="data-table__empty" role="status">{{ label() }}</p>
