@for (toast of toasts.toasts(); track toast.id) {
  <div
    class="toast"
    [class.toast--leaving]="toast.leaving"
    [attr.data-type]="toast.type"
    role="status"
    aria-live="polite"
  >
    <i class="toast__icon" [class]="'toast__icon ' + iconFor(toast.type)" aria-hidden="true"></i>
    <div class="toast__body">
      <div class="toast__title">{{ toast.title }}</div>
      @if (toast.description) {
        <div class="toast__description">{{ toast.description }}</div>
      }
    </div>
    <button type="button" class="toast__close" aria-label="סגור הודעה" (click)="toasts.dismiss(toast.id)">
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </div>
}
