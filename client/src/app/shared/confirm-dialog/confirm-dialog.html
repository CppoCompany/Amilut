<p-dialog
  [visible]="true"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '24rem' }"
  header="אישור מחיקה"
  role="alertdialog"
  ariaLabelledBy="confirm-dialog-message"
  (onHide)="onCancel()"
>
  <p id="confirm-dialog-message" class="confirm-dialog__message">{{ message() }}</p>
  <ng-template #footer>
    <p-button [label]="cancelLabel()" severity="secondary" [outlined]="true" (onClick)="onCancel()" />
    <p-button [label]="confirmLabel()" severity="danger" icon="fa-solid fa-trash-can" (onClick)="onConfirm()" />
  </ng-template>
</p-dialog>
