<p-select
  [options]="$any(rows())"
  optionLabel="label"
  optionValue="value"
  [ngModel]="selected()"
  (ngModelChange)="onChange($event)"
  [inputId]="inputId()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [filter]="true"
  filterBy="label"
  [resetFilterOnHide]="true"
  [scrollHeight]="scrollHeight()"
  appendTo="body"
  [fluid]="true"
/>
