<div class="filter-bar" role="search">
  <div class="form-group">
    <label [for]="uid + '-q'">חיפוש</label>
    <input
      pInputText
      [id]="uid + '-q'"
      type="search"
      [placeholder]="searchPlaceholder()"
      [disabled]="disabled()"
      [(ngModel)]="q"
    />
  </div>

  @if (statusOptions(); as options) {
    <div class="form-group">
      <label [for]="uid + '-status'">סטטוס</label>
      <p-select
        [inputId]="uid + '-status'"
        [options]="withAll(options)"
        optionLabel="label"
        optionValue="value"
        [disabled]="disabled()"
        [(ngModel)]="status"
      />
    </div>
  }

  @if (showCustomer()) {
    <div class="form-group">
      <label [for]="uid + '-customer'">לקוח</label>
      <app-customer-autocomplete
        [inputId]="uid + '-customer'"
        placeholder="הקלד שם לקוח לסינון..."
        [disabled]="disabled()"
        [(customer)]="customer"
      />
    </div>
  }

  @if (showCaseNumber()) {
    <div class="form-group">
      <label [for]="uid + '-case'">מספר תיק</label>
      <input
        pInputText
        [id]="uid + '-case'"
        type="text"
        inputmode="numeric"
        placeholder="לדוגמה 1000"
        [disabled]="disabled()"
        [(ngModel)]="caseNumber"
      />
    </div>
  }

  <div class="form-group">
    <label [for]="uid + '-from'">מתאריך</label>
    <p-datepicker
      [inputId]="uid + '-from'"
      dataType="string"
      dateFormat="yy-mm-dd"
      [showIcon]="true"
      [showButtonBar]="true"
      appendTo="body"
      [disabled]="disabled()"
      [(ngModel)]="from"
    />
  </div>

  <div class="form-group">
    <label [for]="uid + '-to'">עד תאריך</label>
    <p-datepicker
      [inputId]="uid + '-to'"
      dataType="string"
      dateFormat="yy-mm-dd"
      [showIcon]="true"
      [showButtonBar]="true"
      appendTo="body"
      [disabled]="disabled()"
      [(ngModel)]="to"
    />
  </div>

  <div class="form-group filter-bar__actions">
    <label>&nbsp;</label>
    <div class="filter-bar__buttons">
      <p-button
        label="נקה"
        icon="fa-solid fa-eraser"
        severity="secondary"
        [outlined]="true"
        [disabled]="disabled()"
        (onClick)="clear.emit()"
      />
    </div>
  </div>
</div>
